<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Poster Therapy — Vent. We'll make it beautiful.</title>
<meta name="description" content="Type a thought. The website interprets it. You get back a designed poster.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ HOME VIEW ============ -->
<main id="home-view" class="view is-active">

  <div class="layout">

    <section class="panel-left">
      <div class="panel-left-inner">

        <p class="brand">Poster Therapy</p>

        <h1 class="hero-headline">Vent.</h1>
        <p class="hero-sub">(or just type your heart out)</p>
        <p class="hero-line">We'll make it beautiful.</p>

        <form id="vent-form" novalidate>
          <textarea
            id="vent-input"
            maxlength="240"
            rows="5"
            placeholder="What's bothering you?"
            autocomplete="off"
          ></textarea>

          <div class="credit-row">
            <button type="button" id="credit-toggle" aria-pressed="false">Add your name</button>
          </div>

          <div id="credit-field-wrap" hidden>
            <input type="text" id="credit-input" maxlength="30" placeholder="Your name" autocomplete="off">
          </div>

          <button type="submit" id="make-btn" disabled>Make Poster</button>
        </form>

      </div>
    </section>

    <aside class="panel-right" aria-hidden="true">
      <div class="showcase-viewport">
        <div class="showcase-track" id="showcase-track"></div>
      </div>
    </aside>

  </div>

  <div class="mobile-showcase" aria-hidden="true">
    <div class="mobile-track" id="mobile-track"></div>
  </div>

</main>

<!-- ============ POSTER VIEW ============ -->
<main id="poster-view" class="view" aria-label="Your poster">
  <div class="poster-stage">
    <div class="poster-viewport" id="poster-viewport">
      <div class="poster-wrapper" id="poster-wrapper"></div>
    </div>
  </div>

  <div class="poster-actions">
    <button id="download-btn" class="btn btn--primary">Download Poster</button>
    <button id="again-btn" class="btn btn--secondary">Create Another</button>
  </div>
</main>

<!-- offscreen true-resolution export target, never shown to the user -->
<div id="export-root" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>
</body>
</html>
