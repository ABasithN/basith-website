<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171714">
  <title>The Call</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <section class="scene">
  <div class="scene-image">
    <img src="the-call.jpg" alt="A telephone waiting for a call">

    <button
      id="speakerButton"
      class="speaker-hotspot"
      aria-label="Answer call on speakerphone">
    </button>
  </div>

  <p class="instruction" id="instruction">Someone is calling.</p>

  <div class="call-controls" id="callControls" hidden>
    <button id="pauseButton">PAUSE</button>
    <button id="endButton" class="end">END CALL</button>
  </div>
</section>

        <div class="phone-body">
          <div class="module">
            <div class="module-label">CALL</div>
            <div class="led" id="led"></div>
          </div>

          <button class="speaker-button" id="speakerButton" aria-label="Answer call on speakerphone">
            <span class="speaker-icon">◖))</span>
            <span class="speaker-label">SPEAKER</span>
          </button>

          <div class="buttons" aria-hidden="true">
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
        </div>

        <div class="phone-base">
          <div class="brand">home<span>line</span></div>
          <div class="status-line" id="statusLine">INCOMING CALL</div>
        </div>
      </div>

      <p class="instruction" id="instruction">Someone is calling.</p>

      <div class="call-controls" id="callControls" hidden>
        <button id="pauseButton">PAUSE</button>
        <button id="endButton" class="end">END CALL</button>
      </div>
    </section>

    <section class="after-call" id="afterCall" hidden>
      <p class="after-kicker">THE LINE IS QUIET</p>
      <h1>Would you like to leave something for the next person?</h1>
      <div class="after-actions">
        <button id="leaveButton">LEAVE A MESSAGE</button>
        <button id="hangButton" class="secondary">HANG UP</button>
      </div>
      <p class="placeholder" id="placeholder" hidden>Message recording comes next.</p>
    </section>
  </main>

  <audio id="messageAudio" preload="auto" src="audio/message-01.mp3"></audio>
  <script src="script.js"></script>
</body>
</html>
