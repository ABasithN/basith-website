<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>UNSENT</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>

  <div id="intro">
  <div class="intro-bubble">Experience the invisible emotional distance between what we feel and what we allow ourselves to say.</div>
  <h1 id="intro-title">UNSENT</h1>
  <button id="begin-btn">Tap to begin</button>
</div>

<div id="app" class="hidden">
    <div id="header">
      <span id="back-chevron">&#8249;</span>
      <span id="contact-name"></span>
    </div>

    <div id="thread"></div>

    <div id="compose-bar">
      <div id="compose-box">
        <span id="compose-text"></span><span id="cursor"></span>
      </div>
    </div>

    <div id="keyboard" aria-hidden="true">
      <div class="kb-row">
        <span class="key">Q</span><span class="key">W</span><span class="key">E</span><span class="key">R</span><span class="key">T</span><span class="key">Y</span><span class="key">U</span><span class="key">I</span><span class="key">O</span><span class="key">P</span>
      </div>
      <div class="kb-row kb-row-mid">
        <span class="key">A</span><span class="key">S</span><span class="key">D</span><span class="key">F</span><span class="key">G</span><span class="key">H</span><span class="key">J</span><span class="key">K</span><span class="key">L</span>
      </div>
      <div class="kb-row">
        <span class="key key-fn key-shift">&#8679;</span><span class="key">Z</span><span class="key">X</span><span class="key">C</span><span class="key">V</span><span class="key">B</span><span class="key">N</span><span class="key">M</span><span class="key key-fn key-del">&#9003;</span>
      </div>
      <div class="kb-row kb-row-bottom">
        <span class="key key-fn key-123">123</span>
        <span class="key key-fn key-globe">&#127760;</span>
        <span class="key key-space">space</span>
        <span class="key key-fn key-return">return</span>
      </div>
    </div>
  </div>

  <!-- Story data files -->
  <script src="stories/story001.js?v=3"></script>
  <script src="stories/story002.js?v=3"></script> 
  <script src="stories/story004.js?v=3"></script>
  <script src="stories/story005.js?v=3"></script>
  <script src="stories/story006.js?v=3"></script>
  <script src="stories/story007.js?v=3"></script>
  <script src="stories/story008.js?v=3"></script>
  <script src="stories/story009.js?v=3"></script>
  <script src="stories/story010.js?v=3"></script> 
  <script src="stories/story011.js?v=3"></script>
  <script src="stories/story012.js?v=3"></script>
  <script src="stories/story013.js?v=3"></script>
  <script src="stories/story014.js?v=3"></script>
  <script src="stories/story015.js?v=3"></script>
  <script src="stories/story016.js?v=3"></script>
  <script src="stories/story017.js?v=3"></script>
  <script src="stories/story018.js?v=3"></script>
  <script src="stories/story019.js?v=3"></script>
  <script src="stories/story020.js?v=3"></script>

  <!-- Engine -->
  <script src="script.js?v=3"></script>
</body>
</html>
